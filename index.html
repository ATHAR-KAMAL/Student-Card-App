<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID Card Generator</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#eef2ff;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    .container{
        width:400px;
        background:white;
        padding:25px;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.1);
    }

    h1{
        text-align:center;
        margin-bottom:20px;
        color:#4338ca;
    }

    .input-group{
        margin-bottom:15px;
    }

    label{
        display:block;
        margin-bottom:5px;
        font-weight:bold;
    }

    input{
        width:100%;
        padding:10px;
        border:1px solid #ccc;
        border-radius:8px;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        background:#4338ca;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#312e81;
    }

    .preview{
        width:100px;
        height:100px;
        border-radius:50%;
        object-fit:cover;
        display:block;
        margin:10px auto;
        border:3px solid #4338ca;
    }
</style>
</head>
<body>

<div class="container">

    <h1>Student ID Generator</h1>

    <form id="studentForm">

        <div class="input-group">
            <label>Name</label>
            <input type="text" id="name" required>
        </div>

        <div class="input-group">
            <label>Age</label>
            <input type="number" id="age" required>
        </div>

        <div class="input-group">
            <label>Class</label>
            <input type="text" id="studentClass" required>
        </div>

        <div class="input-group">
            <label>Student ID</label>
            <input type="text" id="studentId" required>
        </div>

        <div class="input-group">
            <label>Upload Picture</label>
            <input type="file" id="picture" accept="image/*">
        </div>

        <img id="previewImage" class="preview" src="" style="display:none;">

        <button type="submit">Generate ID Card</button>

    </form>

</div>

<script>

const pictureInput = document.getElementById("picture");
const previewImage = document.getElementById("previewImage");

let imageURL = "";

// IMAGE PREVIEW USING DOM
pictureInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            imageURL = e.target.result;

            previewImage.src = imageURL;
            previewImage.style.display = "block";
        };

        reader.readAsDataURL(file);
    }
});


// FORM SUBMIT
document.getElementById("studentForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    // GET VALUES
    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const studentClass = document.getElementById("studentClass").value;
    const studentId = document.getElementById("studentId").value;

    // OPEN NEW PAGE
    const newWindow = window.open("", "_blank");

    // CREATE HTML FOR ID CARD
    newWindow.document.write(`

    <html>
    <head>
        <title>ID Card</title>

        <style>

            body{
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                background:#e0e7ff;
                font-family:Arial;
            }

            .card{
                width:350px;
                background:white;
                border-radius:20px;
                overflow:hidden;
                box-shadow:0 10px 25px rgba(0,0,0,0.2);
                text-align:center;
            }

            .header{
                background:#4338ca;
                color:white;
                padding:20px;
            }

            .header h1{
                font-size:22px;
            }

            .profile{
                margin-top:20px;
            }

            .profile img{
                width:120px;
                height:120px;
                border-radius:50%;
                border:5px solid #4338ca;
                object-fit:cover;
            }

            .details{
                padding:20px;
                text-align:left;
            }

            .details p{
                margin:10px 0;
                font-size:18px;
            }

            .download-btn{
                margin:20px;
                padding:12px 20px;
                background:#4338ca;
                color:white;
                border:none;
                border-radius:8px;
                cursor:pointer;
                font-size:16px;
            }

            .download-btn:hover{
                background:#312e81;
            }

        </style>

    </head>

    <body>

        <div class="card">

            <div class="header">
                <h1>Student ID Card</h1>
                <p>ABC School System</p>
            </div>

            <div class="profile">
                ${
                    imageURL
                    ? `<img src="${imageURL}">`
                    : `<img src="https://via.placeholder.com/120">`
                }
            </div>

            <div class="details">
                <p><strong>Name:</strong> ${name}</p>
                <p><strong>Age:</strong> ${age}</p>
                <p><strong>Class:</strong> ${studentClass}</p>
                <p><strong>ID:</strong> ${studentId}</p>
            </div>

            <button class="download-btn" onclick="window.print()">
                Download / Print
            </button>

        </div>

    </body>
    </html>

    `);

    newWindow.document.close();

});

</script>

</body>
</html>
